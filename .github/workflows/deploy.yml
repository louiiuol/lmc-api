name: Deploy to hosting server

on:
  push:
    branches:
      - deploy # Déploiement sur push dans la branche 'deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Vérifier le code source
      - name: Checkout source code
        uses: actions/checkout@v3

      # Étape 2 : Configurer le cache des modules Node.js
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Étape 3 : Installer les dépendances
      # - name: Install dependencies
      #   run: npm ci # Utilise npm ci pour garantir un environnement propre

      # # Étape 4 : Construire le projet
      # - name: Build project
      #   run: npm run build

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          DATABASE_URL=localhost
          PORT=3000
          JWT_SECRET=hello_jwt_secret
          EOF
      - name: Copy files to OVH (password)
        env:
          OVH_HOST: sshcloud.cluster024.hosting.ovh.net
          OVH_PORT: 42710
          OVH_USER: louiiuj-lmc # ou louiiuj selon celui que tu utilises
          OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          # (Optionnel) vérifier où on atterrit
          sshpass -p "$OVH_PASSWORD" \
            ssh -p "$OVH_PORT" -o StrictHostKeyChecking=no "$OVH_USER@$OVH_HOST" "pwd && ls"

          # Copier uniquement le fichier .env dans le répertoire par défaut (test)
          sshpass -p "$OVH_PASSWORD" \
            scp -P "$OVH_PORT" -o StrictHostKeyChecking=no .env "$OVH_USER@$OVH_HOST":.env

      # Étape 5: Installer ssh pass
