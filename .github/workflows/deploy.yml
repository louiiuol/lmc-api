name: Deploy to hosting server

on:
  push:
    branches:
      - deploy # Déploiement sur push dans la branche 'deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          DATABASE_URL=localhost
          PORT=3000
          JWT_SECRET=hello_jwt_secret
          EOF

      - name: Export built files to OVH server
        env:
          OVH_HOST: sshcloud.cluster024.hosting.ovh.net
          OVH_PORT: 42710
          OVH_USER: louiiuj-lmc # ou louiiuj selon celui que tu utilises
          OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          # Sync de tous les fichiers, sauf le dossier uploads
          sshpass -p "$OVH_PASSWORD" \
            rsync -avz --delete \
              --exclude 'uploads/' \
              --exclude '.git/' \
              --exclude '.github/' \
              -e "ssh -p $OVH_PORT -o StrictHostKeyChecking=no" \
              ./ "$OVH_USER@$OVH_HOST":.
