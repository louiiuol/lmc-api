name: Deploy to hosting server

on:
  push:
    branches:
      - deploy # Déploiement sur push dans la branche 'deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          DATABASE_URL=localhost
          PORT=3000
          JWT_SECRET=hello_jwt_secret
          EOF

      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy

          # 1) contenu du build (dist/app) à la racine du deploy
          cp -r dist/app/* deploy/

          # 2) node_modules complet
          cp -r node_modules deploy/

          # 3) fichiers racine nécessaires
          cp package.json package-lock.json .env deploy/

      - name: Rsync to OVH (one command, keep uploads)
        env:
          OVH_HOST: sshcloud.cluster024.hosting.ovh.net
          OVH_PORT: 42710
          OVH_USER: louiiuj
          OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          # Une seule commande rsync vers la racine, sans toucher uploads/
          sshpass -p "$OVH_PASSWORD" \
            rsync -avz --delete \
              --exclude 'uploads/' \
              -e "ssh -p $OVH_PORT -o StrictHostKeyChecking=no" \
              deploy/ "$OVH_USER@$OVH_HOST":.
